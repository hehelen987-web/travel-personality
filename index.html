      const testView = document.getElementById('test-view');
      const resultView = document.getElementById('result-view');
      const citySightsView = document.getElementById('city-sights-view');
      const questionText = document.getElementById('question-text');
      const optionsContainer = document.getElementById('options-container');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const stepIndicator = document.getElementById('step-indicator');
      const progressDots = document.getElementById('progress-dots');
      const personaNameEl = document.getElementById('persona-name');
      const cityListEl = document.getElementById('city-list');
      const restartLink = document.getElementById('restart-link');
      const canvas = document.getElementById('radar-canvas');
      const cityTitle = document.getElementById('city-title');
      const citySubtitle = document.getElementById('city-subtitle');
      const sightList = document.getElementById('sight-list');
      const sightSearch = document.getElementById('sight-search');
      const backToResult = document.getElementById('back-to-result');

      // ==================== 辅助函数 ====================
      function calculateDimensions() {
        let dims = { culture: 20, nature: 20, adventure: 20, planning: 20, social: 20, budget: 20 };
        answers.forEach((ans, qIdx) => {
          if (ans !== -1 && scoreRules[qIdx] && scoreRules[qIdx][ans]) {
            const rule = scoreRules[qIdx][ans];
            for (let [key, val] of Object.entries(rule)) {
              if (dims[key] !== undefined) dims[key] += val;
            }
          }
        });
        for (let k in dims) {
          dims[k] = Math.min(100, Math.max(0, dims[k]));
        }
        return dims;
      }

      function getPersonaName(dims) {
        if (dims.culture > 75 && dims.planning > 60) return "硬核历史迷";
        if (dims.nature > 75 && dims.adventure > 70) return "荒野探险家";
        if (dims.social > 75 && dims.budget > 60) return "社交美食家";
        if (dims.adventure > 70 && dims.planning < 40) return "随性流浪诗人";
        if (dims.planning > 70 && dims.culture > 60) return "精致计划者";
        if (dims.budget > 70) return "省钱背包客";
        return "自由灵魂旅行者";
      }

      function drawRadar(dims) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        const labels = ['文化', '自然', '猎奇', '计划', '社交', '预算'];
        const keys = ['culture', 'nature', 'adventure', 'planning', 'social', 'budget'];
        const centerX = w/2, centerY = h/2, radius = 85, numAxes = keys.length;
        ctx.strokeStyle = '#DDD4C8';
        ctx.lineWidth = 0.6;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath();
          for (let j = 0; j < numAxes; j++) {
            const angle = (Math.PI * 2 / numAxes) * j - Math.PI/2;
            const r = radius * (i/4);
            const x = centerX + r * Math.cos(angle);
            const y = centerY + r * Math.sin(angle);
            if (j === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
        }
        for (let i = 0; i < numAxes; i++) {
          const angle = (Math.PI * 2 / numAxes) * i - Math.PI/2;
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
          ctx.strokeStyle = '#E2D9CD';
          ctx.stroke();
        }
        ctx.beginPath();
        for (let i = 0; i < numAxes; i++) {
          const val = dims[keys[i]] / 100;
          const angle = (Math.PI * 2 / numAxes) * i - Math.PI/2;
          const x = centerX + radius * val * Math.cos(angle);
          const y = centerY + radius * val * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(183, 164, 139, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#A58B6E';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.fillStyle = '#5E4B37';
        ctx.font = '12px "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        for (let i = 0; i < numAxes; i++) {
          const angle = (Math.PI * 2 / numAxes) * i - Math.PI/2;
          const x = centerX + (radius + 18) * Math.cos(angle);
          const y = centerY + (radius + 18) * Math.sin(angle);
          ctx.fillText(labels[i], x, y + 4);
        }
      }

      function matchCities(dims) {
        return cities.map(city => {
          let score = 0;
          for (let key of ['culture','nature','adventure','planning','social','budget']) {
            score += 1 - Math.abs(dims[key] - city[key]) / 100;
          }
          return { ...city, match: Math.round((score / 6) * 100) };
        }).sort((a, b) => b.match - a.match).slice(0, 3);
      }

      // 个性化景点评分
      function getPersonalizedScore(sight, dims) {
        // 维度映射：用户维度权重影响景点各属性
        const weights = {
          history: dims.culture / 100,
          photo: (dims.social + dims.culture) / 200,
          crowd: 1 - (dims.planning / 100) * 0.7 - (dims.adventure / 100) * 0.3, // 计划性强或猎奇的人更讨厌拥挤
          stamina: 1 - (dims.nature / 100) * 0.5, // 自然爱好者不怕体力消耗
          food: dims.social / 100,
          value: dims.budget / 100,
          unique: dims.adventure / 100
        };
        let score = 0;
        score += sight.history * weights.history;
        score += sight.photo * weights.photo;
        score += (10 - sight.crowd) * weights.crowd; // 拥挤忍受度反向
        score += (10 - sight.stamina) * weights.stamina; // 体力消耗反向
        score += sight.food * weights.food;
        score += sight.value * weights.value;
        score += sight.unique * weights.unique;
        return Math.round(score / 7 * 10); // 归一化到0-100
      }

      function getHighlightDimensions(sight, dims) {
        // 找出用户最看重的维度和最可能踩雷的维度
        const aspects = [
          { key: 'history', label: '历史人文', value: sight.history, weight: dims.culture },
          { key: 'photo', label: '出片颜值', value: sight.photo, weight: (dims.social + dims.culture) / 2 },
          { key: 'crowd', label: '拥挤度', value: sight.crowd, weight: 100 - dims.planning }, // 计划者更讨厌拥挤
          { key: 'stamina', label: '体力消耗', value: sight.stamina, weight: 100 - dims.nature },
          { key: 'food', label: '美食关联', value: sight.food, weight: dims.social },
          { key: 'value', label: '性价比', value: sight.value, weight: dims.budget },
          { key: 'unique', label: '独特性', value: sight.unique, weight: dims.adventure }
        ];
        // 正向匹配（高权重且高得分）
        const positive = aspects.filter(a => a.weight > 50 && a.value > 7).sort((a,b) => b.weight - a.weight);
        // 负面踩雷（高权重但低得分）
        const negative = aspects.filter(a => a.weight > 50 && a.value < 4).sort((a,b) => b.weight - a.weight);
        return {
          positive: positive.length > 0 ? positive[0] : null,
          negative: negative.length > 0 ? negative[0] : null
        };
      }

      function renderSightCard(sight, dims) {
        const score = getPersonalizedScore(sight, dims);
        const highlights = getHighlightDimensions(sight, dims);
        const isWished = wishlist.includes(sight.name);
        const card = document.createElement('div');
        card.className = 'sight-card';
        card.innerHTML = `
          <div class="sight-header">
            <span class="sight-name">${sight.name}</span>
            <span class="sight-match">与你匹配 ${score}%</span>
          </div>
          <div class="dimension-highlight">
            ${highlights.positive ? `<span class="highlight-badge positive">${highlights.positive.label} ${highlights.positive.value} ← 你极爱</span>` : ''}
            ${highlights.negative ? `<span class="highlight-badge negative">${highlights.negative.label} ${highlights.negative.value} ← 你可能受不了</span>` : ''}
          </div>
          <div class="sight-meta">
            <span>🕒 推荐 ${sight.time} 小时</span>
            <button class="wishlist-btn ${isWished ? 'saved' : ''}" data-sight="${sight.name}">${isWished ? '✓ 已想去' : '+ 想去'}</button>
          </div>
          <div class="alt-section">
            <button class="alt-toggle">替代方案 ▾</button>
            <div class="alt-list hidden">
              ${sight.alt.map(a => `<span class="alt-item" data-alt="${a}">${a}</span>`).join('')}
            </div>
          </div>
        `;
        // 替代方案展开/折叠
        const toggleBtn = card.querySelector('.alt-toggle');
        const altList = card.querySelector('.alt-list');
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          altList.classList.toggle('hidden');
          toggleBtn.textContent = altList.classList.contains('hidden') ? '替代方案 ▾' : '替代方案 ▴';
        });
        // 替代景点点击（若在数据库中则跳转显示）
        card.querySelectorAll('.alt-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const altName = item.dataset.alt;
            const altSight = allSights.find(s => s.name === altName);
            if (altSight) {
              showSingleSight(altSight);
            } else {
              alert(`${altName} 详细信息暂未收录，敬请期待`);
            }
          });
        });
        // 想去按钮
        const wishBtn = card.querySelector('.wishlist-btn');
        wishBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWishlist(sight.name);
          wishBtn.classList.toggle('saved');
          wishBtn.textContent = wishBtn.classList.contains('saved') ? '✓ 已想去' : '+ 想去';
        });
        return card;
      }

      function toggleWishlist(sightName) {
        if (wishlist.includes(sightName)) {
          wishlist = wishlist.filter(s => s !== sightName);
        } else {
          wishlist.push(sightName);
        }
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
      }

      function showSingleSight(sight) {
        if (!userDimensions) return;
        cityTitle.textContent = sight.name;
        citySubtitle.textContent = `位于 ${sight.city}`;
        sightList.innerHTML = '';
        sightList.appendChild(renderSightCard(sight, userDimensions));
        sightSearch.value = '';
        testView.classList.add('hidden');
        resultView.classList.add('hidden');
        citySightsView.classList.remove('hidden');
        currentCity = null; // 标记为非城市浏览
      }

      function showCitySights(cityName) {
        const citySights = allSights.filter(s => s.city === cityName);
        if (!userDimensions || citySights.length === 0) return;
        currentCity = cityName;
        cityTitle.textContent = cityName;
        citySubtitle.textContent = `根据你的人格精选 ${citySights.length} 个景点`;
        sightSearch.value = '';
        renderCitySightList(citySights);
        testView.classList.add('hidden');
        resultView.classList.add('hidden');
        citySightsView.classList.remove('hidden');
      }

      function renderCitySightList(sights) {
        sightList.innerHTML = '';
        if (sights.length === 0) {
          sightList.innerHTML = '<p style="text-align:center; color:#9B8C7A;">暂无匹配景点</p>';
          return;
        }
        const sorted = [...sights].sort((a,b) => getPersonalizedScore(b, userDimensions) - getPersonalizedScore(a, userDimensions));
        sorted.forEach(s => sightList.appendChild(renderSightCard(s, userDimensions)));
      }

      function handleSearch(query) {
        if (!query.trim()) {
          if (currentCity) {
            const citySights = allSights.filter(s => s.city === currentCity);
            renderCitySightList(citySights);
          } else {
            sightList.innerHTML = '';
          }
          return;
        }
        const results = allSights.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
        if (results.length === 0) {
          sightList.innerHTML = '<p style="text-align:center; color:#9B8C7A;">未找到相关景点</p>';
          return;
        }
        renderCitySightList(results);
      }

      // ==================== 视图切换与事件绑定 ====================
      function showResults() {
        userDimensions = calculateDimensions();
        const persona = getPersonaName(userDimensions);
        const topCities = matchCities(userDimensions);
        testView.classList.add('hidden');
        resultView.classList.remove('hidden');
        citySightsView.classList.add('hidden');
        personaNameEl.textContent = persona;
        drawRadar(userDimensions);
        cityListEl.innerHTML = '';
        topCities.forEach(city => {
          const div = document.createElement('div');
          div.className = 'city-card';
          div.innerHTML = `<div class="city-name">${city.name}</div><div class="match-percent">匹配 ${city.match}%</div>`;
          div.addEventListener('click', () => showCitySights(city.name));
          cityListEl.appendChild(div);
        });
      }

      function restartTest() {
        answers = new Array(questions.length).fill(-1);
        currentQuestion = 0;
        userDimensions = null;
        currentCity = null;
        resultView.classList.add('hidden');
        citySightsView.classList.add('hidden');
        testView.classList.remove('hidden');
        renderQuestion();
      }

      backToResult.addEventListener('click', () => {
        if (userDimensions) {
          citySightsView.classList.add('hidden');
          resultView.classList.remove('hidden');
        }
      });

      sightSearch.addEventListener('input', (e) => handleSearch(e.target.value));

      // 测试流程
      function renderQuestion() {
        const q = questions[currentQuestion];
        questionText.textContent = q.text;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          if (answers[currentQuestion] === idx) btn.classList.add('selected');
          btn.textContent = opt;
          btn.addEventListener('click', () => selectOption(idx));
          optionsContainer.appendChild(btn);
        });
        stepIndicator.textContent = `${currentQuestion + 1}/${questions.length}`;
        prevBtn.disabled = currentQuestion === 0;
        nextBtn.textContent = currentQuestion === questions.length - 1 ? '查看结果 ✦' : '下一题 →';
        renderProgressDots();
      }

      function renderProgressDots() {
        progressDots.innerHTML = '';
        for (let i = 0; i < questions.length; i++) {
          const dot = document.createElement('span');
          dot.className = 'progress-dot' + (i === currentQuestion ? ' active' : '');
          if (answers[i] !== -1) dot.style.background = '#B09A7A';
          progressDots.appendChild(dot);
        }
      }

      function selectOption(index) {
        answers[currentQuestion] = index;
        renderQuestion();
      }

      prevBtn.addEventListener('click', () => {
        if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
      });

      nextBtn.addEventListener('click', () => {
        if (answers[currentQuestion] === -1) { alert('请先选择一个选项'); return; }
        if (currentQuestion < questions.length - 1) { currentQuestion++; renderQuestion(); }
        else { showResults(); }
      });

      restartLink.addEventListener('click', restartTest);

      // 启动
      renderQuestion();
    })();
  </script>
</body>
</html>
