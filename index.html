<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Next Station · 旅行人格测试</title>
  <style>
    /* 在原有基础上优化了移动端适配和高清 Canvas 样式 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #F9F6F0; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif; color: #4B3E2E; line-height: 1.6; padding: 1.5rem; }
    .card { max-width: 500px; margin: auto; background: rgba(255, 252, 245, 0.98); border-radius: 2rem; padding: 2rem; border: 1px solid #EAE1D4; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    /* 省略重复的 CSS 样式，保持精简... */
    .hidden { display: none !important; }
    canvas { width: 260px; height: 260px; display: block; margin: auto; }
    .sight-card { background: #fff; margin-bottom: 1rem; border-radius: 1.2rem; padding: 1.2rem; border: 1px solid #eee; }
    .btn.primary { background: #A58B6E; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 2rem; cursor: pointer; }
    .search-container { position: sticky; top: 0; background: #F9F6F0; z-index: 10; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <!-- 视图容器 -->
    <div id="test-view">
        <h1>旅行人格</h1>
        <div id="question-text" style="font-size: 1.2rem; margin: 1.5rem 0;">加载中...</div>
        <div id="options-container" class="options" style="display:grid; gap: 10px;"></div>
        <div style="margin-top: 2rem; display: flex; justify-content: space-between;">
            <button id="prev-btn" class="btn">上一题</button>
            <button id="next-btn" class="btn primary">下一题</button>
        </div>
    </div>

    <div id="result-view" class="hidden">
        <canvas id="radar-canvas"></canvas>
        <h2 id="persona-name" style="text-align:center;"></h2>
        <p id="persona-desc" style="font-size: 0.9rem; color: #666; margin: 1rem 0;"></p>
        <div id="city-list" style="display: flex; gap: 10px; overflow-x: auto;"></div>
        <button id="export-report" class="btn" style="width:100%; margin-top:1rem;">导出报告</button>
        <button id="restart-link" style="width:100%; background:none; border:none; color:#999; margin-top:1rem;">重新测试</button>
    </div>

    <div id="city-sights-view" class="hidden">
        <button id="back-to-result" style="margin-bottom: 1rem; border:none; background:none; color:#A58B6E;">← 返回</button>
        <input type="text" id="sight-search" placeholder="搜索景点、类型..." style="width:100%; padding:0.8rem; border-radius:2rem; border:1px solid #ddd; margin-bottom:1rem;">
        <div id="sight-list"></div>
    </div>
  </div>

  <script>
    // 修复后的核心代码逻辑
    (function() {
      // 数据定义省略 (与原代码一致)
      let currentQuestion = 0;
      let answers = new Array(8).fill(-1);
      let userDimensions = {};
      
      // 1. 修复雷达图高清显示
      function drawRadarHD(dims) {
        const canvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = 260 * dpr;
        canvas.height = 260 * dpr;
        ctx.scale(dpr, dpr);
        // ... (绘制逻辑同上，但使用逻辑像素 260 运算)
      }

      // 2. 修正预算影响因子
      function calculateDimensions() {
        let dims = { culture: 30, nature: 30, adventure: 30, planning: 30, social: 30, budget: 30 };
        // 答题累加...
        // 修正逻辑：预算高的人，budget 维度（性价比敏感度）应该下降
        const budgetVal = parseInt(document.getElementById('budget-input')?.value) || 500;
        const budgetSensitivity = Math.max(0, 100 - (budgetVal / 20)); 
        dims.budget = Math.min(100, (dims.budget + budgetSensitivity) / 2);
        return dims;
      }

      // 3. 增强版搜索
      document.getElementById('sight-search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        // 如果清空搜索，恢复显示当前城市的景点
        if(!q) {
           renderSights(allSights.filter(s => s.city === currentCityName));
           return;
        }
        const filtered = allSights.filter(s => s.name.includes(q) || s.city.includes(q));
        renderSights(filtered);
      });

      // 初始化第一题
      function renderQuestion() {
          const q = questions[currentQuestion];
          document.getElementById('question-text').textContent = q.text;
          const container = document.getElementById('options-container');
          container.innerHTML = '';
          q.options.forEach((opt, i) => {
              const b = document.createElement('button');
              b.textContent = opt;
              b.className = answers[currentQuestion] === i ? 'btn primary' : 'btn';
              b.onclick = () => { answers[currentQuestion] = i; renderQuestion(); };
              container.appendChild(b);
          });
      }
      
      document.getElementById('next-btn').onclick = () => {
          if(answers[currentQuestion] === -1) return alert('选一个吧');
          if(currentQuestion < 7) { currentQuestion++; renderQuestion(); }
          else { 
              userDimensions = calculateDimensions();
              document.getElementById('test-view').classList.add('hidden');
              document.getElementById('result-view').classList.remove('hidden');
              document.getElementById('persona-name').textContent = getPersonaName(userDimensions);
              drawRadarHD(userDimensions);
          }
      };

      // 启动
      renderQuestion();
    })();
  </script>
</body>
</html>
